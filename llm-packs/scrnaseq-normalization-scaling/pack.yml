id: sib/scrnaseq-normalization-scaling
title: "Normalization, variable feature selection and scaling (Seurat 5)"
version: 0.1.0
status: pilot

scope: >
  Log-normalizing counts, selecting variable features, and scaling - the
  standard Seurat NormalizeData + FindVariableFeatures + ScaleData workflow,
  plus SCTransform as the documented alternative. Starts from a QC-filtered
  Seurat object (one or more samples). Ends at a scaled object with variable
  features identified, ready for RunPCA. Does not cover dimensionality
  reduction, integration or clustering - separate packs.

provenance:
  repo: https://github.com/sib-swiss/single-cell-r-training
  derived_from:
    - day2/day2-1_normalization_scaling.qmd
    - llm-packs/_dev/transcripts/QS6ZH_41b4s.clean.txt   # lecture recording, shared with day2-2
  course: "SIB: Single-cell transcriptomics with R"
  dataset: "Caron et al. 2020, paediatric B-ALL and PBMMC bone marrow (10x 3' GEX)"
  maintainer:
    name: "TODO: named individual, not a team alias"
    email: "TODO@sib.swiss"
  license: CC-BY-4.0

validity:
  last_validated: null
  validated_against:
    R: "4.6.0"
    Seurat: "5.5.0"
    SeuratObject: "5.4.0"
    container: "sibswiss/training-singlecell-rstudio:2026.6"
    renv_lock: "renv.lock@main"
  validation_entrypoint: validate/run_all.R
  stale_after_days: 120
  on_stale: >
    Tell the user, before giving any advice from this pack, that it has not
    been re-tested against current package versions and may be out of date.

applies_when:
  object: "Seurat >= 5.0, already QC-filtered"
  input_state: "Raw (or ambient-corrected) counts, not yet normalised"

not_applicable_to:
  - what: "An object that has not been QC-filtered yet"
    why: "Normalizing before filtering lets low-quality cells influence the scale factor and the variable-feature selection. See scrnaseq-qc-filtering."
  - what: "Choosing between NormalizeData+ScaleData and SCTransform for the user"
    why: >
      Both are legitimate; this course teaches the three-function workflow
      for transparency and uses SCTransform only as a documented bonus
      exercise. State the tradeoff (SCTransform is slower and less stepwise
      transparent, but arguably more principled) rather than picking silently.

depends_on:
  in_lockfile:
    - Seurat
    - SeuratObject
    - glmGamPoi
  recommended_but_absent: []
