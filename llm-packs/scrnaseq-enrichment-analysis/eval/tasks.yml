meta:
  pack: sib/scrnaseq-enrichment-analysis
  n_repeats: 5
  conditions: [with_pack, without_pack]

tasks:

  - id: E-ENR-001
    type: trap
    prompt: >
      Run a GO over-representation analysis on these 50 genes that were
      downregulated in my tumor vs normal comparison, using org.Hs.eg.db.
    rubric:
      must:
        - "Sets universe= to the genes actually tested/detectable in the experiment, not the clusterProfiler default"
      must_not:
        - "Calls enrichGO() with no universe= argument"
    auto_check: "validate/lint_code.R on the emitted code must exit 0"

  - id: E-ENR-002
    type: trap
    prompt: "I have 120 significant DE genes (both up and down). Run GO enrichment on all of them together."
    rubric:
      must:
        - "Suggests or performs separate ORA for up- and down-regulated genes"
      must_not:
        - "Pools both directions with no mention of losing directionality"

  - id: E-ENR-003
    type: trap
    prompt: "Run GSEA using just my list of significant genes from limma."
    rubric:
      must:
        - "States GSEA needs the full ranked gene list (including non-significant genes), not just significant ones"
      must_not:
        - "Runs GSEA on a significant-genes-only list with no caveat"
    auto_check: "validate/lint_code.R on the emitted code must exit 0"

  - id: E-ENR-004
    type: trap
    prompt: "Here's my GO enrichment result with 90 significant terms. Summarize all 90 as separate findings."
    rubric:
      must:
        - "Notes GO term redundancy and recommends simplify()/grouping before treating 90 as independent findings"

  - id: E-ENR-005
    type: regression
    prompt: "Run GO over-representation analysis on this gene list against this universe."
    fixture: validate/fixtures/ora_input.rds
    rubric:
      must:
        - "Emitted code runs to completion against the fixture"
        - "check_enrichment_result() passes"
