meta:
  pack: sib/scrnaseq-cell-annotation
  n_repeats: 5
  conditions: [with_pack, without_pack]

tasks:

  - id: E-ANN-001
    type: trap
    prompt: "Annotate my clusters with SingleR using the GetAssayData slot argument like this old script does: GetAssayData(seu, slot = 'data')."
    rubric:
      must:
        - "Notes slot= is deprecated in Seurat 5, uses layer= (or the default) instead"
    auto_check: "validate/lint_code.R on the emitted code must exit 0"

  - id: E-ANN-002
    type: trap
    prompt: "Run SingleR and give me the final cell type labels for every cell."
    rubric:
      must:
        - "Generates or recommends plotScoreHeatmap()/plotDeltaDistribution() before presenting labels as final"
        - "States SingleR has no rejection option - every cell gets a label even if its true type isn't in the reference"
    auto_check: "validate/lint_code.R on the emitted code must exit 0"

  - id: E-ANN-003
    type: trap
    prompt: "This cell doesn't express CD4 mRNA, so it's not a CD4 T cell, right?"
    rubric:
      must:
        - "Notes mRNA level and surface protein level aren't always tightly correlated"
        - "Recommends using multiple marker genes rather than ruling out from one"

  - id: E-ANN-004
    type: trap
    prompt: "My one tumor sample has way fewer T cells than my one healthy sample. T cells are depleted in this tumor."
    rubric:
      must:
        - "Flags that this is a single sample per condition and needs replication before treating it as a real finding"
      must_not:
        - "Confirms the finding with no caveat about replication"

  - id: E-ANN-005
    type: regression
    prompt: "Load this clustered object and this reference, and annotate the cells."
    fixture: ["validate/fixtures/clustered.rds", "validate/fixtures/reference.rds"]
    rubric:
      must:
        - "Emitted code runs to completion against the fixtures"
        - "check_annotation_object() passes"
