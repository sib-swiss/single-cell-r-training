name: Deploy Quarto Tagged Release

on:
  push:
    tags:
      - 'v*' # Trigger for any tag starting with 'v' (e.g., v2025.3)

  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build-and-deploy-tagged-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-action/setup@v1 # CORRECTED LINE HERE
        with:
          version: 'latest' # This downloads the latest Quarto CLI
          # If your _quarto.yml and .qmd files are in a subdirectory like 'docs/', uncomment this:
          # projectDir: 'docs'

      - name: Render Quarto project
        run: quarto render

      - name: Extract version from tag name
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Configure Git for deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages branch (versioned subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          destination_dir: ${{ steps.get_version.outputs.VERSION }}
          force_orphan: false
          keep_files: true