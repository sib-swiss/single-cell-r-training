name: Deploy Quarto Tagged Release

on:
  push:
    tags:
      - 'v*' # Trigger for any tag starting with 'v' (e.g., v2025.3)

  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build-and-deploy-tagged-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Adjust as needed for your project's build time

    permissions:
      contents: write # To push to gh-pages branch
      pages: write    # To deploy to GitHub Pages
      id-token: write # For OIDC authentication (recommended for pages)

    steps:
      - name: Checkout repository at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Checkout the specific tag that triggered the workflow
          fetch-depth: 0        # Ensure full history for Quarto and other tools

      - name: Setup Quarto
        uses: quarto-dev/quarto-action@v2
        with:
          version: 'latest' # Or a specific version like '1.4.0'
          # If your _quarto.yml and .qmd files are in a subdirectory like 'docs/', uncomment this:
          # projectDir: 'docs'

      - name: Render Quarto project
        run: quarto render

      - name: Extract version from tag name
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Configure Git for deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages branch (versioned subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site             # The directory Quarto outputs to
          publish_branch: gh-pages         # The branch GitHub Pages serves from
          destination_dir: ${{ steps.get_version.outputs.VERSION }} # e.g., 'v2025.3/'
          force_orphan: false              # IMPORTANT: Do not delete existing content
          keep_files: true                 # IMPORTANT: Ensures existing version folders are kept
          # Note: peaceiris/actions-gh-pages v4 with force_orphan: false and destination_dir
          # correctly creates/updates the subdirectory without affecting others.
          # The `keep_files: true` is an explicit safeguard but might not be strictly
          # necessary with force_orphan: false for new subdirs, but it doesn't hurt.
