name: Deploy Quarto Latest Docs

on:
  push:
    branches:
      - main # Or 'master', depending on your primary branch name

jobs:
  build-and-deploy-latest-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Quarto
        uses: quarto-dev/quarto-action/setup@v2 # CORRECTED HERE
        with:
          version: 'latest'
          # projectDir: 'docs' # Uncomment if your Quarto project is in a subdirectory

      - name: Render Quarto project
        run: quarto render

      - name: Configure Git for deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages branch (latest subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          destination_dir: latest
          force_orphan: false
          keep_files: true