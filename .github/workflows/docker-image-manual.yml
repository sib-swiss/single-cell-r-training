name: Build and push Docker

on:
  workflow_dispatch:
  push:
    branches:
      - deepak
      - main

jobs:
  # ------------------------------
  # AMD64 build (runs on GitHub-hosted)
  # ------------------------------
  build-amd64:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            sibswiss/training-singlecell-rstudio
          tags: |
            latest
            ${{ github.ref_name }}

      - name: Log in to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
        shell: bash

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: /renv_cache
          key: ${{ runner.os }}-renv-${{ hashFiles('Docker/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Build and push AMD64 image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./Docker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=renv
          cache-to: type=gha,mode=max,scope=renv

  # ------------------------------
  # ARM64 build (runs on self-hosted ARM runner)
  # ------------------------------
  build-arm64:
    runs-on: [self-hosted, arm64]
    needs: build-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            sibswiss/training-singlecell-rstudio
          tags: |
            latest
            ${{ github.ref_name }}

      - name: Log in to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
        shell: bash

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: /renv_cache
          key: ${{ runner.os }}-renv-${{ hashFiles('Docker/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: ./Docker
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=renv
          cache-to: type=gha,mode=max,scope=renv

  # ------------------------------
  # Create multi-arch manifest
  # ------------------------------
  manifest:
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    steps:
      - name: Log in to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
        shell: bash

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag sibswiss/training-singlecell-rstudio:latest \
            sibswiss/training-singlecell-rstudio:latest@amd64 \
            sibswiss/training-singlecell-rstudio:latest@arm64