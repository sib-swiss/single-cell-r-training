# .github/workflows/deploy-release-sites.yml
name: Deploy Quarto Release Sub-websites

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*' # Matches date-based versions like v2025.7, v2025.7.1, etc.
  workflow_dispatch: # Allow manual trigger
    inputs:
      version:
        description: 'Version to deploy (e.g., v2025.7.2)'
        required: true
        type: string

env:
  # Configure these variables for your setup
  MAIN_BRANCH: main
  DEPLOY_BRANCH: gh-pages
  BASE_URL: https://yourusername.github.io/your-repo-name

jobs:
  deploy-release-site:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for all branches and tags
      
      - name: Extract version info
        id: version
        run: |
          # Get version from tag or manual input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          
          # Extract major version (e.g., v2025.7.1 -> v2025.7)
          MAJOR_VERSION=$(echo $VERSION | sed -E 's/^(v[0-9]+\.[0-9]+).*$/\1/')
          
          # Extract year (e.g., v2025.7 -> 2025)
          YEAR=$(echo $VERSION | sed -E 's/^v([0-9]+)\..*$/\1/')
          
          # Extract minor version number (e.g., v2025.7 -> 7)
          MINOR=$(echo $VERSION | sed -E 's/^v[0-9]+\.([0-9]+).*$/\1/')
          
          # Check if this is a sub-release (has more than 2 parts)
          SUB_RELEASE=""
          if [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            SUB_RELEASE=$(echo $VERSION | sed -E 's/^v[0-9]+\.[0-9]+\.(.+)$/\1/')
            IS_SUB_RELEASE="true"
          else
            IS_SUB_RELEASE="false"
          fi
          
          # Site path structure: year/major-version (e.g., 2025/v2025.7)
          SITE_PATH="${YEAR}/${MAJOR_VERSION}"
          
          echo "full_version=$VERSION" >> $GITHUB_OUTPUT
          echo "major_version=$MAJOR_VERSION" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "sub_release=$SUB_RELEASE" >> $GITHUB_OUTPUT
          echo "is_sub_release=$IS_SUB_RELEASE" >> $GITHUB_OUTPUT
          echo "site_path=$SITE_PATH" >> $GITHUB_OUTPUT
          
          echo "Full version: $VERSION"
          echo "Major version: $MAJOR_VERSION"
          echo "Year: $YEAR"
          echo "Minor: $MINOR"
          echo "Sub-release: $SUB_RELEASE"
          echo "Is sub-release: $IS_SUB_RELEASE"
          echo "Site path: $SITE_PATH"
      
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release
      
      - name: Setup R (if needed)
        uses: r-lib/actions/setup-r@v2
        if: hashFiles('**/*.qmd') != '' || hashFiles('**/*.Rmd') != ''
        with:
          use-public-rspm: true
      
      - name: Setup Python (if needed)
        uses: actions/setup-python@v4
        if: hashFiles('**/*.qmd') != '' && hashFiles('requirements.txt') != ''
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt
      
      - name: Install R dependencies
        if: hashFiles('renv.lock') != ''
        uses: r-lib/actions/setup-renv@v2
      
      - name: Configure Quarto for release
        run: |
          # Create a temporary _quarto.yml for this release
          cp _quarto.yml _quarto-release.yml
          
          # Update the site URL to include the version path
          sed -i "s|site-url:.*|site-url: \"${{ env.BASE_URL }}/${{ steps.version.outputs.site_path }}\"|g" _quarto-release.yml
          
          # Add version info to the site
          echo "  version: \"${{ steps.version.outputs.full_version }}\"" >> _quarto-release.yml
          echo "  major-version: \"${{ steps.version.outputs.major_version }}\"" >> _quarto-release.yml
          echo "  year: \"${{ steps.version.outputs.year }}\"" >> _quarto-release.yml
          
          if [ "${{ steps.version.outputs.is_sub_release }}" = "true" ]; then
            echo "  sub-release: \"${{ steps.version.outputs.sub_release }}\"" >> _quarto-release.yml
          fi
      
      - name: Render Quarto site
        run: |
          quarto render --profile release --config _quarto-release.yml
      
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}
          path: gh-pages
          fetch-depth: 0
      
      - name: Deploy to version subdirectory
        run: |
          # Create version directory structure if it doesn't exist
          mkdir -p gh-pages/${{ steps.version.outputs.site_path }}
          
          # Copy rendered site to version directory
          cp -r _site/* gh-pages/${{ steps.version.outputs.site_path }}/
          
          cd gh-pages
          
          # Create or update release metadata
          mkdir -p .releases
          
          # Record this release
          cat > .releases/${{ steps.version.outputs.full_version }}.json << EOF
          {
            "version": "${{ steps.version.outputs.full_version }}",
            "major_version": "${{ steps.version.outputs.major_version }}",
            "year": "${{ steps.version.outputs.year }}",
            "minor": "${{ steps.version.outputs.minor }}",
            "sub_release": "${{ steps.version.outputs.sub_release }}",
            "is_sub_release": ${{ steps.version.outputs.is_sub_release }},
            "path": "${{ steps.version.outputs.site_path }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          
          # Create main index.html if it doesn't exist
          if [ ! -f index.html ]; then
            cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Release Versions</title>
              <style>
                  body { 
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
                      margin: 0; padding: 40px; background: #f8f9fa; 
                  }
                  .container { max-width: 1000px; margin: 0 auto; background: white; 
                              padding: 40px; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,0.1); }
                  h1 { color: #2c3e50; margin-bottom: 30px; }
                  h2 { color: #34495e; margin: 30px 0 15px 0; border-bottom: 2px solid #3498db; 
                       padding-bottom: 5px; }
                  .year-section { margin-bottom: 40px; }
                  .version-group { margin-bottom: 25px; padding: 20px; background: #f8f9fa; 
                                  border-radius: 8px; border-left: 4px solid #3498db; }
                  .major-version { font-size: 1.2em; font-weight: bold; color: #2c3e50; 
                                  margin-bottom: 15px; }
                  .version-link { 
                      display: inline-block; padding: 8px 16px; margin: 4px 8px 4px 0; 
                      background: #3498db; color: white; text-decoration: none; 
                      border-radius: 6px; font-size: 0.9em; transition: background-color 0.2s;
                  }
                  .version-link:hover { background: #2980b9; }
                  .version-link.major { background: #27ae60; font-weight: bold; }
                  .version-link.major:hover { background: #229954; }
                  .sub-release { margin-left: 20px; }
                  .latest-badge { 
                      display: inline-block; background: #e74c3c; color: white; 
                      padding: 2px 8px; border-radius: 12px; font-size: 0.8em; 
                      margin-left: 10px; 
                  }
                  .meta { color: #7f8c8d; font-size: 0.9em; margin-top: 5px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>📚 Documentation Versions</h1>
                  <div id="versions-container">
                      <p>Loading versions...</p>
                  </div>
              </div>
              
              <script>
                  async function loadVersions() {
                      try {
                          const response = await fetch('versions.json');
                          const versions = await response.json();
                          displayVersions(versions);
                      } catch (error) {
                          document.getElementById('versions-container').innerHTML = 
                              '<p>Error loading versions. Please check back later.</p>';
                      }
                  }
                  
                  function displayVersions(versions) {
                      const container = document.getElementById('versions-container');
                      const yearGroups = {};
                      
                      // Group versions by year and major version
                      versions.forEach(v => {
                          if (!yearGroups[v.year]) yearGroups[v.year] = {};
                          if (!yearGroups[v.year][v.major_version]) {
                              yearGroups[v.year][v.major_version] = [];
                          }
                          yearGroups[v.year][v.major_version].push(v);
                      });
                      
                      let html = '';
                      const sortedYears = Object.keys(yearGroups).sort((a, b) => b - a);
                      
                      sortedYears.forEach(year => {
                          html += `<div class="year-section"><h2>${year}</h2>`;
                          
                          const majorVersions = Object.keys(yearGroups[year]).sort((a, b) => {
                              const aNum = parseFloat(a.replace('v' + year + '.', ''));
                              const bNum = parseFloat(b.replace('v' + year + '.', ''));
                              return bNum - aNum;
                          });
                          
                          majorVersions.forEach((majorVersion, index) => {
                              const versionList = yearGroups[year][majorVersion].sort((a, b) => {
                                  if (a.is_sub_release && b.is_sub_release) {
                                      return parseFloat(b.sub_release) - parseFloat(a.sub_release);
                                  }
                                  if (a.is_sub_release && !b.is_sub_release) return -1;
                                  if (!a.is_sub_release && b.is_sub_release) return 1;
                                  return 0;
                              });
                              
                              const isLatest = index === 0; // First major version in year
                              
                              html += `<div class="version-group">`;
                              html += `<div class="major-version">
                                  ${majorVersion}${isLatest ? '<span class="latest-badge">Latest</span>' : ''}
                              </div>`;
                              
                              versionList.forEach(version => {
                                  const linkClass = version.is_sub_release ? 'version-link' : 'version-link major';
                                  const linkText = version.is_sub_release ? 
                                      `${version.version} (${version.sub_release})` : 
                                      version.version;
                                  
                                  html += `<a href="${version.path}/" class="${linkClass}">${linkText}</a>`;
                              });
                              
                              html += `<div class="meta">Path: /${yearGroups[year][majorVersion][0].path}/</div>`;
                              html += `</div>`;
                          });
                          
                          html += `</div>`;
                      });
                      
                      container.innerHTML = html;
                  }
                  
                  loadVersions();
              </script>
          </body>
          </html>
          EOF
          fi
          
          # Generate versions.json
          echo "Generating versions index..."
          echo "[" > versions.json
          
          # Process all release metadata files
          find .releases -name "*.json" -type f | sort | while read -r file; do
            if [ -f "$file" ]; then
              cat "$file"
              echo ","
            fi
          done | sed '$ s/,$//' >> versions.json
          
          echo "]" >> versions.json
      
      - name: Commit and push changes
        run: |
          cd gh-pages
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Deploy ${{ steps.version.outputs.full_version }} to ${{ steps.version.outputs.site_path }}
            
            - Version: ${{ steps.version.outputs.full_version }}
            - Major: ${{ steps.version.outputs.major_version }}
            - Year: ${{ steps.version.outputs.year }}
            - Is sub-release: ${{ steps.version.outputs.is_sub_release }}"
            
            git push origin ${{ env.DEPLOY_BRANCH }}
            echo "Successfully deployed ${{ steps.version.outputs.full_version }}"
          fi
      
      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.full_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Major Version**: ${{ steps.version.outputs.major_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Year**: ${{ steps.version.outputs.year }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Site Path**: ${{ steps.version.outputs.site_path }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Site URL**: ${{ env.BASE_URL }}/${{ steps.version.outputs.site_path }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Main Index**: ${{ env.BASE_URL }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.version.outputs.is_sub_release }}" = "true" ]; then
            echo "- **Sub-release**: ${{ steps.version.outputs.sub_release }}" >> $GITHUB_STEP_SUMMARY
          fi

  # Clean up old versions (keep only latest 2 years and 3 major versions per year)
  cleanup-old-versions:
    runs-on: ubuntu-latest
    needs: deploy-release-site
    if: github.event_name == 'push' # Only run on tag pushes, not manual dispatch
    
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      
      - name: Clean up old versions
        run: |
          KEEP_YEARS=2
          KEEP_MAJOR_PER_YEAR=3
          
          if [ ! -d ".releases" ]; then
            echo "No releases directory found, skipping cleanup"
            exit 0
          fi
          
          # Get all years with releases
          find .releases -name "*.json" -exec jq -r '.year' {} \; | sort -nr | uniq > years.txt
          
          TOTAL_YEARS=$(wc -l < years.txt)
          echo "Found $TOTAL_YEARS years with releases"
          
          # Remove old years
          if [ $TOTAL_YEARS -gt $KEEP_YEARS ]; then
            echo "Keeping latest $KEEP_YEARS years"
            tail -n +$((KEEP_YEARS + 1)) years.txt | while read -r old_year; do
              echo "Removing old year: $old_year"
              rm -rf "$old_year"
              git add "$old_year"
            done
          fi
          
          # For each kept year, clean up old major versions
          head -n $KEEP_YEARS years.txt | while read -r year; do
            if [ -d "$year" ]; then
              echo "Cleaning up major versions for year $year"
              
              # Get major versions for this year, sorted by minor version (descending)
              find "$year" -maxdepth 1 -type d -name "v*" | sed "s|$year/||" | \
                sort -t. -k2,2nr > "${year}_majors.txt"
              
              TOTAL_MAJORS=$(wc -l < "${year}_majors.txt")
              
              if [ $TOTAL_MAJORS -gt $KEEP_MAJOR_PER_YEAR ]; then
                echo "Found $TOTAL_MAJORS major versions in $year, keeping $KEEP_MAJOR_PER_YEAR"
                
                tail -n +$((KEEP_MAJOR_PER_YEAR + 1)) "${year}_majors.txt" | while read -r old_major; do
                  echo "Removing old major version: $year/$old_major"
                  rm -rf "$year/$old_major"
                  git add "$year/$old_major"
                  
                  # Remove associated metadata files
                  find .releases -name "v*" -name "*.json" | while read -r meta_file; do
                    if jq -e ".major_version == \"$old_major\" and .year == \"$year\"" "$meta_file" > /dev/null 2>&1; then
                      echo "Removing metadata: $meta_file"
                      rm -f "$meta_file"
                      git add "$meta_file"
                    fi
                  done
                done
              fi
              
              rm -f "${year}_majors.txt"
            fi
          done
          
          # Regenerate versions.json after cleanup
          echo "[" > versions.json
          find .releases -name "*.json" -type f | sort | while read -r file; do
            if [ -f "$file" ]; then
              cat "$file"
              echo ","
            fi
          done | sed '$ s/,$//' >> versions.json
          echo "]" >> versions.json
          
          # Commit cleanup changes
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          if ! git diff --staged --quiet; then
            git commit -m "Clean up old version directories and metadata"
            git push origin gh-pages
            echo "Cleaned up old versions"
          else
            echo "No cleanup needed"
          fi
          
          rm -f years.txt