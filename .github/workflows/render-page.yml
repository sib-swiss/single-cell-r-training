name: Render and publish Quarto site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - deepak

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: sibswiss/training-singlecell-rstudio:latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean previous build artifacts & caches
        run: |
          rm -rf _site _freeze _quarto/_cache .quarto || true
          echo "Cleaned old build artifacts and caches"

      - name: Render Quarto site (fresh, no cache)
        run: quarto render --no-cache

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4