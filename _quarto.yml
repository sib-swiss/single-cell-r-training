name: Render and publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name of the release to publish (e.g., v2025.7)'
        required: true
        default: ''
  push:
    paths:
      - '**.qmd'
      - '**.yml'
      - '_freeze/**'
    branches:
      - master
      - deepak
  release:
    types: [published]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    container:
      image: sibswiss/training-singlecell-rstudio:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site with latest profile
        run: |
          quarto render --profile latest

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'

      - name: Deploy Latest
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: latest

  publish-release:
    runs-on: ubuntu-latest
    container:
      image: sibswiss/training-singlecell-rstudio:latest  # Default image
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}

      - name: Set up specific Docker image for release (if available)
        if: startsWith(github.event.inputs.release_tag || github.event.release.tag_name, 'v')
        run: |
          TAG=${{ github.event.inputs.release_tag || github.event.release.tag_name }}
          if [ "$TAG" == "v2025.7" ]; then
            echo "Using Docker image sibswiss/training-singlecell-rstudio:v2025.7"
            # Note: This is a workaround; actual image switch requires a new job or custom action
            docker pull sibswiss/training-singlecell-rstudio:v2025.7 || echo "Falling back to latest"
          fi

      - name: Build site with release profile
        run: |
          quarto render --profile ${{ github.event.inputs.release_tag || github.event.release.tag_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'

      - name: Deploy Release
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          destination_dir: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}